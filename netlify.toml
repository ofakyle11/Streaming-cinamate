[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 7 needs Node 20.19+ or 22.12+; CI (.github/workflows/ci.yml) uses the same major.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Functions sit behind /api/*. The rate limit stops the TMDB proxy from being
# used as a free key: more than 60 requests a minute from one IP get a 429.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  [redirects.rate_limit]
    window_limit = 60
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The app uses none of these; denying them means a compromised third-party
    # script or an injected iframe cannot ask for them either.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), browsing-topics=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # A window opened from another site gets a fresh browsing context group, so
    # a cross-origin page can never hold a reference to ours. Sign-in is a
    # redirect (never a popup), so nothing on the site needs the opener.
    Cross-Origin-Opener-Policy = "same-origin"
    # Content-Security-Policy is generated into dist/_headers by
    # scripts/security-headers.mjs at build time (it depends on whether a
    # Turnstile site key is set). Edit the CSP there, never here.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted font subsets are cached as long as the bundles. The file names
# are not hashed, so a re-cut subset must get a new file name (update
# src/styles/fonts.css and the preloads in index.html together).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
