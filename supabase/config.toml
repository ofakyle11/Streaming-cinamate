# Supabase project configuration for Lastframe.tv.
#
# Two jobs: `supabase start` runs a local stack with these settings, and
# `supabase config push` applies the [auth] section to the linked project so
# the dashboard never has to be clicked through (docs/SUPABASE.md has the
# steps). Only the keys that matter to the app are set; everything else keeps
# the Supabase default. Nothing secret lives here: secrets come from the
# environment through env(NAME) when the config is pushed.

project_id = "lastframe-tv"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[realtime]
enabled = false

# ------------------------------------------------------------------- auth

[auth]
enabled = true
# Production origin: the fallback redirect and the {{ .SiteURL }} in the email
# template (the mark is loaded from it), so never a preview. Local sign-ins
# still return to localhost because the client passes its own redirect URL.
site_url = "https://lastframe.tv"
# Every origin that may finish a sign-in: the magic link lands on /auth/callback
# (src/services/auth/validate.ts). Deploy previews stay in mock mode, so only
# production and local development are listed.
additional_redirect_urls = [
  "https://lastframe.tv/auth/callback",
  "https://www.lastframe.tv/auth/callback",
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback",
]
# Access tokens live 30 minutes; refresh tokens rotate and a reused one is
# tolerated for 10 seconds (two tabs refreshing at once).
jwt_expiry = 1800
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.rate_limit]
# Supabase defaults. email_sent only applies with the custom SMTP below; the
# built-in mailer is capped at 2 an hour regardless.
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30
anonymous_users = 30

[auth.email]
enable_signup = true
# A change of address is confirmed from both the old and the new mailbox.
double_confirm_changes = true
# Magic links need no separate confirmation step.
enable_confirmations = false
secure_password_change = false
# One link request per address per 45 seconds; /sign-in/sent shows the same timer.
max_frequency = "45s"
# Links are single use (GoTrue) and expire after 15 minutes.
otp_length = 6
otp_expiry = 900

[auth.email.template.magic_link]
subject = "Your Lastframe.tv sign-in link"
content_path = "./templates/magic-link.html"

# Resend as the sender. RESEND_API_KEY is read from the environment when the
# config is pushed; it is never committed. Local `supabase start` uses Inbucket
# instead, so run it with this section's enabled flag overridden to false or
# with the key exported.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@mail.lastframe.tv"
sender_name = "Lastframe.tv"

# Cloudflare Turnstile (T5). Off until the site key is also in the Netlify
# build (VITE_TURNSTILE_SITE_KEY); turn both on in the same release, otherwise
# every sign-in fails. Then set enabled = true and export TURNSTILE_SECRET_KEY.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(TURNSTILE_SECRET_KEY)"

# Google stays off at launch (decision 2A). To switch it on: create the OAuth
# client with the Supabase callback URL as its redirect, export the two values
# below, set enabled = true, push, and set VITE_AUTH_GOOGLE=1 in Netlify.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
skip_nonce_check = false
