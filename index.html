<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141126" />
    <!-- Theme bootstrap: applies the saved theme (localStorage "lf.theme") to <html> and the metas above before first paint. Keep it the first script, after the metas. -->
    <script src="/theme-init.js"></script>
    <link
      rel="preload"
      href="/fonts/gabarito-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- Icon links carry ?v= so browsers drop a cached favicon when the mark changes. Bump it with the next icon change. -->
    <link rel="icon" href="/favicon-32.png?v=lumen" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=lumen" type="image/svg+xml" />
    <link rel="mask-icon" href="/mask-icon.svg?v=lumen" color="#5b47e0" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=lumen" sizes="180x180" />
    <title>Lastframe.tv</title>
    <meta
      name="description"
      content="Lastframe.tv — discover films and TV series, see where to watch them and keep your watchlist in one place."
    />
    <meta property="og:site_name" content="Lastframe.tv" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lastframe.tv" />
    <meta
      property="og:description"
      content="Lastframe.tv — discover films and TV series, see where to watch them and keep your watchlist in one place."
    />
    <meta property="og:url" content="https://lastframe.tv/" />
    <link rel="canonical" href="https://lastframe.tv/" />
    <meta property="og:image" content="https://lastframe.tv/og-landing.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lastframe.tv" />
    <meta
      name="twitter:description"
      content="Lastframe.tv — discover films and TV series, see where to watch them and keep your watchlist in one place."
    />
    <meta name="twitter:image" content="https://lastframe.tv/og-landing.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
